spring.application.name=fundoo-notes

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fundoo_notes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1mdW5kb28tbm90ZXMtZGVmYXVsdC1zZWNyZXQtMDAwMDAwMDA=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ActiveMQ Configuration
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.jms.pub-sub-domain=false

# JMS Queue
app.jms.user-registration-queue=${APP_JMS_USER_REGISTRATION_QUEUE:user.registration.queue}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Queue
app.rabbitmq.reminder-queue=${APP_RABBITMQ_REMINDER_QUEUE:fundoo.reminder.queue}

# RabbitMQ Exchange
app.rabbitmq.reminder-exchange=${APP_RABBITMQ_REMINDER_EXCHANGE:fundoo.reminder.exchange}

# RabbitMQ Routing Key
app.rabbitmq.reminder-routing-key=${APP_RABBITMQ_REMINDER_ROUTING_KEY:reminder.created}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

# Redis Key Expiry
app.redis.otp-expiration=${APP_REDIS_OTP_EXPIRATION:300}
app.redis.token-expiration=${APP_REDIS_TOKEN_EXPIRATION:86400}

# Spring Cache Configuration
spring.cache.type=simple

# Spring Batch Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
