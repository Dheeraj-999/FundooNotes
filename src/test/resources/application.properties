spring.application.name=fundoo-notes
server.port=8080

# In-memory H2 database configuration for isolated, self-contained test execution
spring.datasource.url=jdbc:h2:mem:fundoo_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration for testing
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1mdW5kb28tbm90ZXMtdW5pdC10ZXN0cy1vbmx5LTAxMjM0NTY3ODk=
app.jwt.expiration-ms=86400000

# Embedded In-VM ActiveMQ Broker for isolated test execution
spring.activemq.broker-url=vm://localhost?broker.persistent=false
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false
app.jms.user-registration-queue=user.registration.queue

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.reminder-queue=fundoo.reminder.queue
app.rabbitmq.reminder-exchange=fundoo.reminder.exchange
app.rabbitmq.reminder-routing-key=reminder.created

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
app.redis.otp-expiration=300
app.redis.token-expiration=86400

# Spring Cache Configuration
spring.cache.type=simple

# Spring Batch Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
